id = "cpp-usleep"
version = 2
phrase = "use usleep for thread delays"
description = "usleep is non-portable; prefer a typed duration and thread sleep."
language = "cpp"
severity = "minor"
mortal = false
engine = "ast-grep"
tags = ["portability"]

[paths]
include = ["**/*.cpp", "**/*.cc", "**/*.h", "**/*.hpp"]
exclude = []

[match]
rule = { pattern = "usleep($$$ARGS)" }

[examples]
bad = ["usleep(1000);\n"]
good = ["sleep_for(1ms);\n"]
