# Local SonarQube Server fallback stack (Community + PostgreSQL)
# Data persists under ~/.config/sft/sonar-local/volumes/
services:
  sonarqube-db:
    image: postgres:16-alpine
    container_name: sft-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: sft-sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

volumes:
  sonarqube_db:
    name: sft-sonarqube-db
  sonarqube_data:
    name: sft-sonarqube-data
  sonarqube_extensions:
    name: sft-sonarqube-extensions
  sonarqube_logs:
    name: sft-sonarqube-logs
