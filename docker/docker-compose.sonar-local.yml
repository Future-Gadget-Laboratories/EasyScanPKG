# Local SonarQube Server fallback stack (Community + PostgreSQL)
# Data persists under ~/.config/sft/sonar-local/volumes/
#
# Memory and restart policy come from SFT_SQ_* variables that sonar-local-up
# derives from SFT_SONAR_MEM_PROFILE / SFT_SONAR_MEM_LIMIT / SFT_SONAR_AUTOSTART
# (lib/sonar_runtime.py). The defaults below equal the "low" profile with
# autostart on, so a plain `docker compose up` gets the same caps.
services:
  sonarqube-db:
    image: postgres:16-alpine
    container_name: sft-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: "${SFT_SQ_RESTART:-unless-stopped}"

  sonarqube:
    image: sonarqube:community
    container_name: sft-sonarqube
    # Fixed hostname that always resolves inside the container: the embedded
    # Elasticsearch aborts with UnknownHostException when it cannot resolve it.
    hostname: sft-sonarqube
    extra_hosts:
      - "sft-sonarqube:127.0.0.1"
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_WEB_JAVAOPTS: "${SFT_SQ_WEB_JAVAOPTS:--Xmx512m -Xms128m}"
      SONAR_CE_JAVAOPTS: "${SFT_SQ_CE_JAVAOPTS:--Xmx640m -Xms128m}"
      SONAR_SEARCH_JAVAOPTS: "${SFT_SQ_SEARCH_JAVAOPTS:--Xmx512m -Xms512m}"
    mem_limit: "${SFT_SQ_MEM_LIMIT:-2560m}"
    memswap_limit: "${SFT_SQ_MEMSWAP_LIMIT:-2560m}"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: "${SFT_SQ_RESTART:-unless-stopped}"

volumes:
  sonarqube_db:
    name: sft-sonarqube-db
  sonarqube_data:
    name: sft-sonarqube-data
  sonarqube_extensions:
    name: sft-sonarqube-extensions
  sonarqube_logs:
    name: sft-sonarqube-logs
