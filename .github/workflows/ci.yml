name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Offline EasyScan check
        run: |
          chmod +x bin/* commission.sh install.sh
          ./bin/easyscan-check --offline --skip-tests

  scanner-harness:
    # Installs every default scanner tool and runs the auto-routed scan on this
    # repo (dogfood). Fails on a crashed scanner or any finding at medium
    # (MAJOR) severity or above.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install scanner tools
        env:
          GITHUB_TOKEN: ${{ github.token }}  # avoids GitHub API rate limits for release downloads
        run: |
          chmod +x bin/* commission.sh install.sh
          ./bin/easyscan-install-scanners --non-interactive
          ./bin/easyscan-install-scanners --status
      - name: Scan plan
        run: ./bin/easyscan-scan --workspace "$PWD" --plan
      - name: Multi-scanner scan (auto mode, gate at medium+)
        run: ./bin/easyscan-scan --workspace "$PWD" --fail-on-error --fail-on-severity medium
      - name: Upload issue checklist
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: easyscan-issue-checklist
          path: .sft/issue-checklist.*
          include-hidden-files: true  # .sft/ is a dot-directory
          if-no-files-found: warn
